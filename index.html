<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Grafondex Live Score</title>
<style>
/* Grafondex: blue & white */
:root{
  --bg:#eef4ff;--card:#fff;--card2:#f1f6ff;--line:#e0e9f9;--text:#0b1f4a;--muted:#5d6f95;
  --accent:#1667f2;--accent2:#0ea5ff;--live:#e5383b;--star:#f5b301;
  --grad:linear-gradient(100deg,#0f4fd8,#1a8cff 60%,#16b0ff);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:56px;padding:0 8px;padding-top:env(safe-area-inset-top);background:var(--grad);color:#fff;box-shadow:0 2px 10px rgba(15,79,216,.25)}
header h1{flex:1;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.hlogo{width:34px;height:34px;border-radius:50%;background:#fff;padding:2px;margin-left:4px}
.iconbtn{width:40px;height:40px;border-radius:20px;font-size:22px;display:grid;place-items:center;color:#fff}
.iconbtn:active{background:rgba(255,255,255,.18)}
.picker{width:100%;margin-bottom:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600}
.form-block{padding:10px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.form-block:last-child{border-bottom:0}
.form-block label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form-block input{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-weight:400}
.hint{font-size:12px;color:var(--muted)}
.btn{padding:11px;border-radius:12px;background:var(--grad);color:#fff;font-weight:600}
.seg a{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg a.on{background:var(--grad);color:#fff;font-weight:600}
.card h2 a.lglink{margin-left:0;color:var(--text);font-weight:700;display:flex;align-items:center;gap:6px}
.card h2 a.lglink span{color:var(--accent)}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow a{flex:1;display:flex;align-items:center;gap:12px;padding:12px;min-width:0}
.lrow a:active{background:var(--card2)}
.lgi{width:24px;height:17px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px var(--line);flex:none;display:inline-block;vertical-align:-3px;font-size:16px;line-height:17px;text-align:center}
.lgi.lgl{height:24px;object-fit:contain;box-shadow:none;border-radius:0;vertical-align:-6px}
.lgi.big{width:52px;height:38px}
.lhead b .lgi{width:20px;height:14px;vertical-align:-1px}
.lrow .nm{flex:1;font-weight:500}
.lrow .go{color:var(--muted);font-size:18px}
.pin{width:44px;height:44px;font-size:20px;color:var(--muted)}
.pin.on{color:var(--star)}
.lhead{display:flex;align-items:center;gap:12px;padding:14px}
.lhead img{width:52px;height:52px;object-fit:contain}
.lhead .flag.big{font-size:40px}
.lhead div{flex:1;display:flex;flex-direction:column}
.lhead b{font-size:18px}
.lhead small{color:var(--muted);font-size:12px}
.roundnav{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.roundnav a{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--grad);color:#fff;font-size:24px;font-weight:700}
.roundnav a.off{background:var(--line);color:var(--muted)}
.roundnav select{flex:1;min-width:0;height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;text-align:center}
.sub{display:block;color:var(--muted);font-size:11px;font-weight:400}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcell{position:relative;background:var(--card);border-radius:14px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12.5px;font-weight:500}
.favstar{width:34px;height:34px;flex:none;font-size:20px;line-height:1;color:var(--muted);border-radius:17px;margin-left:auto}
.favstar.on{color:var(--star)}
.favstar:active{background:var(--card2)}
.tcell .favstar{position:absolute;top:2px;right:2px}
.hero .side .favstar{margin:2px auto 0}
.hero .side>a{display:flex;flex-direction:column;align-items:center;gap:6px}
td.t .favstar{width:28px;height:28px;font-size:17px}
.logo.mid{width:40px;height:40px}
.about{text-align:center;padding:12px 0 4px}
.about img{width:180px;height:180px}
main{padding:10px 10px calc(76px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:20px;color:var(--muted)}
nav#tabs a span{font-size:11px}
nav#tabs a.on{color:var(--accent)}
.card{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card h2{font-size:13px;margin:0;padding:10px 12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.card h2 a{margin-left:auto;color:var(--accent);font-weight:500}
.logo{width:22px;height:22px;object-fit:contain;flex:none}
.logo.big{width:56px;height:56px}
.match{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match:active{background:var(--card2)}
.mtime{width:44px;flex:none;text-align:center;font-size:13px;color:var(--muted)}
.mtime.live{color:var(--live);font-weight:700}
.mtime small{display:block;font-size:11px;font-weight:400}
.teams{flex:1;min-width:0}
.tm{display:flex;align-items:center;gap:8px;padding:2px 0}
.lg{font-size:11px;color:var(--muted);margin-bottom:1px}
.tm .tn{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.tm .ts{min-width:20px;text-align:right;font-weight:700}
.tm .ts.live{color:var(--live)}
.tm.win .tn{font-weight:700}
.star{color:var(--star);font-size:12px}
.scores{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:700;min-width:18px}
.scores b{padding:2px 0;line-height:22px}
.scores.live b{color:var(--live)}
.datebar{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.datebar::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.datebar a{flex:none;text-align:center;padding:6px 10px;border-radius:10px;background:var(--card);font-size:12px;color:var(--muted);min-width:56px}
.datebar a b{display:block;font-size:15px;color:var(--text)}
.datebar a.on{background:var(--grad);color:#fff}
.datebar a.on b{color:#fff}
.datebar b i{font-style:normal;font-size:10px;font-weight:500}
.cal{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:4px 8px;border-radius:10px;background:var(--card);border:1.5px solid var(--accent);font-size:18px;color:var(--accent)}
.cal small{font-size:10px;font-weight:600}
.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.daytitle{font-size:13px;font-weight:600;color:var(--muted);margin:-4px 2px 10px;text-transform:capitalize}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips a{flex:none;padding:7px 12px;border-radius:18px;background:var(--card);font-size:13px;white-space:nowrap}
.chips a.on{background:var(--accent);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.spin{margin:60px auto;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hero{padding:16px 12px;text-align:center}
.hero .row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hero .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0}
.hero .side span{max-width:100%;overflow-wrap:anywhere;line-height:1.25}
.hero .mid{min-width:96px;padding-top:8px}
.hero .sc{font-size:32px;font-weight:800;letter-spacing:2px}
.hero .st{font-size:13px;color:var(--muted);margin-top:2px}
.hero .st.live{color:var(--live);font-weight:700}
.hero .meta{color:var(--muted);font-size:12px;margin-top:12px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);font-weight:600}
.pane{display:none}.pane.on{display:block}
.ev{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);gap:8px;font-size:14px}
.ev:last-child{border-bottom:0}
.ev .min{width:40px;flex:none;color:var(--muted);font-size:13px;text-align:center}
.ev .who{flex:1;min-width:0}
.ev .who small{display:block;color:var(--muted);font-size:12px}
.ev.away{flex-direction:row-reverse;text-align:right}
.ev .ic{width:22px;text-align:center}
.stat{padding:9px 12px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.stat .l span:nth-child(2){color:var(--muted)}
.bars{display:flex;gap:4px;height:6px}
.bars i{display:block;border-radius:3px;background:var(--line)}
.bars i.h{background:var(--accent)}
.bars i.a{background:#7cc4ff}
.pl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.pl:last-child{border-bottom:0}
.pl .no{width:26px;text-align:center;color:var(--muted);font-weight:600;font-size:13px}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ps{color:var(--muted);font-size:12px}
.pl .in{color:var(--accent)}.pl .out{color:var(--live)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:500;font-size:11px;padding:8px 3px;text-align:center}
td{padding:7px 3px;text-align:center;border-top:1px solid var(--line)}
td.t{text-align:left}
td.t a{display:flex;align-items:center;gap:7px}
td.t span{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
td.r{border-left:3px solid transparent;font-weight:600;width:28px}
td.p{font-weight:700}
tr.fav td{background:color-mix(in srgb,var(--star) 10%,transparent)}
.legend{padding:8px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.favbtn{margin-top:10px;padding:8px 16px;border-radius:18px;background:var(--card2);font-size:14px}
.favbtn.on{background:var(--star);color:#111}
.setrow{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow input{width:20px;height:20px;accent-color:var(--accent)}
.setrow span{flex:1}
.note{color:var(--muted);font-size:12px;padding:4px 12px 16px;text-align:center}
.err{text-align:center;padding:40px 20px;color:var(--muted)}
.err button{margin-top:12px;padding:8px 18px;border-radius:18px;background:var(--accent);color:#fff}
.form{display:flex;gap:3px;justify-content:center;margin-top:4px}
.form i{font-style:normal;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:#fff}
.form .W{background:#16a34a}.form .D{background:#6b7280}.form .L{background:#dc2626}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.rrow:last-child{border-bottom:0}
.rrow:active{background:var(--card2)}
.rrow .rd{width:48px;flex:none;font-size:12px;color:var(--muted);text-align:center}
.rrow .rd small{display:block;font-size:10px}
.rrow .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow .rt span{overflow-wrap:anywhere;line-height:1.25}
.rrow .rt .me{font-weight:700}
.rrow .rs{display:flex;flex-direction:column;gap:3px;font-weight:700;text-align:right;min-width:18px}
.res{font-style:normal;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.res.W{background:#16a34a}.res.D{background:#6b7280}.res.L{background:#dc2626}
/* coloured match events */
.evlist .ev{border-left:4px solid transparent;align-items:flex-start}
.evlist .ev.away{border-left:0;border-right:4px solid transparent}
.evlist .ev .min{font-weight:700;color:var(--text);padding-top:2px}
.evbadge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.3px;padding:2px 8px;border-radius:10px;margin-bottom:4px}
.evbody{font-size:14px;font-weight:600;line-height:1.5}
.evbody small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ev-goal{background:#e9f9ef;border-color:#16a34a !important}
.ev-goal .evbadge{background:#16a34a;color:#fff}
.ev-yellow{background:#fff8db;border-color:#eab308 !important}
.ev-yellow .evbadge{background:#facc15;color:#422006}
.ev-red{background:#fdecec;border-color:#dc2626 !important}
.ev-red .evbadge{background:#dc2626;color:#fff}
.ev-sub{background:#eef4ff;border-color:#1667f2 !important}
.ev-sub .evbadge{background:#1667f2;color:#fff}
.ev-miss{background:#f3f4f6;border-color:#6b7280 !important}
.ev-miss .evbadge{background:#6b7280;color:#fff}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:8px;color:#fff;white-space:nowrap}
.chip.in{background:#16a34a}.chip.out{background:#dc2626}
.pl.pin{background:#effaf3}.pl.pout{background:#fdf1f1}
.pl .chip{margin-left:4px}
.weektitle{font-size:15px;font-weight:800;color:var(--accent);margin:0 2px 10px}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.langbtn{padding:11px 8px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.langbtn.on{background:var(--grad);color:#fff;border-color:transparent}
.inforow{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
.inforow:last-child{border-bottom:0}
.inforow .ic{width:24px;text-align:center}
.inforow .k{width:96px;flex:none;color:var(--muted);font-weight:600;font-size:13px}
.inforow .v{flex:1;font-weight:600}
/* ---- compact layout: smaller type, tighter rows, more matches per screen ---- */
html,body{font-size:13.5px}
header{height:46px;gap:6px}
header h1{font-size:16px}
.hlogo{width:28px;height:28px}
.iconbtn{width:36px;height:36px;font-size:19px}
main{padding:6px 6px calc(56px + env(safe-area-inset-bottom))}
nav#tabs a{padding:5px 0 4px;font-size:17px;gap:0}
nav#tabs a span{font-size:10px}
.card{border-radius:10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(11,31,74,.06)}
.card h2{font-size:12px;padding:6px 10px;gap:6px}
.match{padding:5px 10px;gap:8px}
.mtime{width:42px;font-size:12px}
.mtime small.tv{font-size:9.5px;color:var(--accent);font-weight:700;white-space:nowrap;margin-top:1px}
.tm{gap:6px;padding:1px 0;font-size:13px}
.logo{width:18px;height:18px}
.logo.big{width:44px;height:44px}
.logo.mid{width:32px;height:32px}
.tm .ts{font-size:13.5px}
.tbadge{width:18px;height:18px;border-radius:50%;background:var(--card2);color:var(--accent);font-size:10px;font-weight:800;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.datebar{gap:4px;padding:0 0 6px}
.datebar a,.cal{min-width:46px;padding:4px 6px;border-radius:8px;font-size:11px}
.datebar a b{font-size:13px}
.cal{font-size:15px}
.cal small{font-size:9px}
.daytitle{font-size:12px;margin:0 2px 6px}
.lgi{width:20px;height:20px;object-fit:contain;border-radius:0;box-shadow:none;vertical-align:middle;flex:none}
.lgflag{display:inline-flex;align-items:center;justify-content:center}
.lgflag .flag{margin:0;width:20px;height:14px}
.lgi.big{width:40px;height:40px}
.lgflag.big .flag{width:36px;height:25px}
.flag{width:16px;height:11px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--line);vertical-align:-1px;margin-right:4px;flex:none}
.card h2 a.lglink{gap:8px;min-width:0}
.lgname{display:flex;flex-direction:column;line-height:1.15;color:var(--text);font-weight:700;font-size:12.5px}
.lgname small{color:var(--muted);font-weight:500;font-size:10.5px}
.region{display:flex;align-items:center;color:var(--muted);font-size:11px;font-weight:500;margin-top:1px}
.lrow a{padding:7px 10px;gap:10px}
.lrow .nm{display:flex;flex-direction:column;font-weight:600;font-size:13px}
.pin{width:38px;height:38px;font-size:17px}
.lhead{padding:10px;gap:10px}
.lhead b{font-size:15px}
.seg{padding:2px;margin-bottom:6px;border-radius:10px}
.seg button,.seg a{padding:6px 0;font-size:12px;border-radius:8px}
.roundnav{gap:6px;margin-bottom:6px}
.roundnav a{width:36px;height:36px;font-size:20px;border-radius:10px}
.roundnav select{height:36px;font-size:13px;border-radius:10px}
.weektitle{font-size:13px;margin:0 2px 6px}
.hero{padding:10px 8px}
.hero .side{font-size:12.5px;gap:4px}
.hero .sc{font-size:26px}
.hero .mid{min-width:80px;padding-top:6px}
.tvtag{margin-top:8px;display:inline-block;background:#eef4ff;color:var(--accent);font-weight:700;font-size:12px;padding:3px 10px;border-radius:12px}
.ev{padding:6px 10px;font-size:13px}
.evbody{font-size:13px;line-height:1.4}
.evbadge{font-size:10px;padding:1px 7px;margin-bottom:2px}
.stat{padding:6px 10px}
.stat .l{font-size:12px;margin-bottom:3px}
.bars{height:5px}
.pl{padding:5px 10px;font-size:13px;gap:8px}
table{font-size:12px}
th{padding:5px 2px;font-size:10.5px}
td{padding:4px 2px}
td.t a{gap:6px}
td.t .favstar{width:24px;height:24px;font-size:14px}
.favstar{width:28px;height:28px;font-size:16px}
.tgrid{gap:6px;grid-template-columns:repeat(4,1fr)}
.tcell{padding:10px 4px 8px;font-size:11px;border-radius:10px;gap:5px}
.inforow{padding:7px 10px;font-size:13px}
.inforow .k{width:88px;font-size:12px}
.rrow{padding:6px 10px;font-size:13px}
.empty{padding:28px 16px;font-size:13px}
.setrow{padding:8px 10px;gap:10px}
.langs{padding:8px;gap:6px}
.langbtn{padding:8px 6px;font-size:13px}
.favbtn{padding:6px 14px;font-size:13px}
.about img{width:120px;height:120px}
/* sport switcher */
.sportbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.sportbar::-webkit-scrollbar{display:none}
.sportbar button{flex:none;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.sportbar button span{font-size:15px}
.sportbar button.on{background:var(--grad);color:#fff;border-color:transparent}
/* match events timeline */
.tl{padding:2px 0}
.tl-row{display:grid;grid-template-columns:1fr 48px 1fr;align-items:center;min-height:38px;padding:4px 8px}
.tl-row+.tl-row{border-top:1px solid #eef2f9}
.tl-min{justify-self:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--card2);border-radius:10px;padding:2px 7px;white-space:nowrap;min-width:30px;text-align:center}
.tl-min:empty{display:none}
.tl-goal{background:#f4fbf6}
.tl-goal .tl-min{background:#16a34a;color:#fff}
.tl-ev{display:flex;align-items:center;gap:7px;font-size:13px;line-height:1.3}
.tl-side.home .tl-ev{flex-direction:row-reverse;text-align:right}
.tl-txt{display:flex;flex-direction:column;min-width:0}
.tl-txt b{font-weight:700;color:var(--text)}
.tl-txt small{color:var(--muted);font-size:11px}
.tl-in{color:var(--text);font-weight:600}
.tl-out{color:var(--muted);font-size:12px}
.tl-in i,.tl-out i{font-style:normal;font-weight:800}
.tl-in i.up{color:#16a34a}
.tl-ic{flex:none;width:18px;display:grid;place-items:center;font-size:14px}
.cardic{display:inline-block;width:10px;height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.cardic.y{background:#facc15}.cardic.r{background:#dc2626}
.subic{font-style:normal;color:var(--accent);font-weight:800;font-size:15px}
.missic{font-style:normal;color:var(--muted);font-weight:800}
.tl-break{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding:3px;background:var(--card2);letter-spacing:.6px}
.pl .arr{font-weight:800;font-size:14px;margin-left:2px}
.pl .arr.up{color:#16a34a}.pl .arr.down{color:#9aa6bd}
.hero .side .rec{color:var(--muted);font-size:11px;font-weight:600}
table.lines td,table.lines th{padding:6px 4px}
table.lines td.t{white-space:nowrap;font-weight:700}
table.lines td.t .logo{vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="back" hidden aria-label="Geri">‹</button>
  <img class="hlogo" id="hlogo" src="logo-g.png" alt="Grafondex">
  <h1 id="title">Maçlar</h1>
  <button class="iconbtn" id="refresh" aria-label="Yenile">⟳</button>
</header>
<main id="app"><div class="spin"></div></main>
<nav id="tabs">
  <a href="#/matches" data-tab="matches">⚽<span>Maçlar</span></a>
  <a href="#/leagues" data-tab="leagues">🏆<span>Ligler</span></a>
  <a href="#/favs" data-tab="favs">★<span>Favoriler</span></a>
  <a href="#/settings" data-tab="settings">⚙️<span>Ayarlar</span></a>
</nav>
<script src="i18n.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
